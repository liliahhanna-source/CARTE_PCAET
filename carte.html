<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte interactive — Plan Climat Métropole</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style-carte.css" />
</head>
<body>
  <header class="header-carte">
    <a href="index.html" class="retour-accueil">← Accueil</a>
    <h1>Carte des projets du Plan Climat</h1>
  </header>

  <div id="filtres-panel">
    <div class="filtre-groupe">
    <label for="filtre-commune">Commune :</label>
    <select id="filtre-commune">
      <option value="all">Toutes les communes</option>
    </select>
  </div>
    <div class="filtre-groupe">
      <label for="filtre-concertation">Participation citoyenne :</label>
      <select id="filtre-concertation">
        <option value="all">Tous les projets</option>
        <option value="co-construit">🟢 Co-construits</option>
        <option value="consulté">🔵 Consultés</option>
        <option value="informé">🟡 Informés</option>
        <option value="non">⚪ Sans concertation formelle</option>
      </select>
    </div>
    <div class="filtre-groupe">
      <label for="filtre-cobenefit">Co-bénéfice :</label>
      <select id="filtre-cobenefit">
        <option value="all">Tous</option>
        <option value="Confort thermique">🌡️ Confort thermique</option>
        <option value="Eau">💧 Eau & biodiversité</option>
        <option value="air">🌬️ Qualité de l'air</option>
        <option value="Énergie">⚡ Énergie</option>
        <option value="nuisances">🔇 Réduction des nuisances</option>
        <option value="Lien social">🤝 Lien social</option>
      </select>
    </div>
  </div>

  <div id="map"></div>
  <p id="map-status"></p>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
